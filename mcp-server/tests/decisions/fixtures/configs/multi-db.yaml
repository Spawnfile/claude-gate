    policy: confirm
    confidence: 0.95
    discovered_from: []
  - name: postgres_local
    matchers:
      - tool: "mcp__plugin_*_postgres__*"
        mcp_server_id: "postgres"
    env: local
    policy: allow
    confidence: 0.9
    discovered_from: []
  - name: supabase_devbox
    matchers:
      - tool: "mcp__plugin_*_supabase_devbox__*"
        mcp_server_id: "supabase_devbox"
    env: dev
    policy: dev
    confidence: 0.9
    discovered_from: []
