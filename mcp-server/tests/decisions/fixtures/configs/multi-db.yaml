    matchers:
      - tool: "mcp__plugin_*_supabase_prod__*"
        mcp_server_id: "supabase_prod"
    env: prod
    policy: strict
    confidence: 0.99
    discovered_from: []
  - name: supabase_dev
    matchers:
      - tool: "mcp__plugin_*_supabase_dev__*"
        mcp_server_id: "supabase_dev"
